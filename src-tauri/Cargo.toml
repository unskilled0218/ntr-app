[package]
name = "ntr"
version = "0.14.0"
description = "Local-first desktop client for todo.txt tasks and a Markdown note — local files or a my-ntr-server over HTTP."
authors = ["musty"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { version = "1", features = ["time"] }
# Native HTTP for server mode: reaches HTTPS reverse proxies (e.g. https://ntr.lan) with
# self-signed certs and is not subject to webview CORS. `default-tls` links the system OpenSSL
# (present in this image) so no extra C-build tooling is needed; `stream` gives
# Response::bytes_stream() for the SSE bridge.
reqwest = { version = "0.13", default-features = false, features = ["stream", "default-tls"] }
futures-util = "0.3"

